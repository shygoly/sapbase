name: CI

# 包管理器约定：本仓库统一使用 npm（唯一锁文件 = 根目录 package-lock.json）。
# 不再跑 npm/pnpm/yarn/bun 四包管理器 × 三平台矩阵 —— 那条矩阵来自上游模板，
# 它验证的是模板资产而非本仓库产品代码，却让 CI 结果随包管理器漂移。
# 详见 docs/PACKAGE_MANAGER.md。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wasm-modules:
    name: Wasm Atomic Modules
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      # 编译准入判定逻辑（tsc → dist/），scripts 从这里 require
      - name: Build admission logic
        run: npm run wasm:build

      # 闸 0 源码预检 + 闸 1 静态白名单拒绝集 + 闸 2 双构建器复现 + ABI 往返
      # 用 host 隔离模式：CI 里没有 Docker，且这是"本机自证"路径（不静默回退）
      - name: Test gates and ABI
        env:
          WASM_BUILD_ISOLATION: host
        run: npm run wasm:test

      # 入库产物字节 = 清单哈希 = 源码重建哈希
      - name: Verify reproducible build
        env:
          WASM_BUILD_ISOLATION: host
        run: npm run wasm:reproducible -- modules/available-inventory-rust

      # 产物与清单的变更必须进版本控制，否则运行时校验会失败
      - name: Ensure build artifacts are committed
        run: |
          if [ -n "$(git status --porcelain wasm-modules/build)" ]; then
            echo "::error::wasm-modules/build 有未提交的改动 —— 请提交更新后的产物与清单"
            git status --porcelain wasm-modules/build
            exit 1
          fi

  wasm-host:
    name: Wasm Host Engine (Rust sidecar)
    # 执行引擎二进制必须与 backend 一起可构建：默认引擎已是 wasmtime，
    # 缺二进制时原子接口会（按设计）显式失败而不是回退。
    # linux/arm64 走 cross-rs（在 ubuntu runner 上用容器交叉编译）；
    # 该行在本机（macOS）无法验证 —— cross 需要 Linux 宿主或容器内 Rust，
    # 已实测：cross-rs 镜像不自带 Rust、cross CLI 在 macOS 会回落到宿主 cargo。
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      # wasmtime 48 的 MSRV 是 1.95，与 wasm-modules 的工具链一致（升级需同时改两处）
      - name: Test engine
        if: ${{ !matrix.cross }}
        run: cargo test --release --locked --target ${{ matrix.target }} --manifest-path crates/wasm-host/Cargo.toml

      - name: Build engine binary
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path crates/wasm-host/Cargo.toml

      # linux/arm64：容器内交叉编译（runner 有 Docker）
      - name: Install cross
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@cross

      - name: Build engine binary (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --locked --target ${{ matrix.target }} --manifest-path crates/wasm-host/Cargo.toml

      - name: Upload engine binary
        uses: actions/upload-artifact@v4
        with:
          name: wasm-host-${{ matrix.target }}
          path: crates/wasm-host/target/${{ matrix.target }}/release/wasm-host
          if-no-files-found: error

  apps:
    name: Apps (backend / speckit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 首次把产品代码接入 CI：允许失败以便先暴露问题、不阻塞合并。
    # 稳定后应改为 false。
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Build shared schemas
        run: npm run build --workspace shared-schemas

      - name: Type-check backend
        run: npm run build --workspace backend

      - name: Test backend
        run: npm run test --workspace backend

      - name: Build frontend
        run: npm run build --workspace speckit

  validate:
    name: Validate Components
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Validate agents
        run: node scripts/ci/validate-agents.js

      - name: Validate hooks
        run: node scripts/ci/validate-hooks.js

      - name: Validate commands
        run: node scripts/ci/validate-commands.js

      - name: Validate skills
        run: node scripts/ci/validate-skills.js

      - name: Validate rules
        run: node scripts/ci/validate-rules.js

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true  # 允许合并，但把高危依赖标出来

  docs:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      # 只 lint 本仓库自己维护的文档。
      # 未纳入：docs/zh-CN/**、docs/zh-TW/** 与根目录的历史文档 —— 它们是上游模板
      # 或早期文档，存在既存的 MD034 / MD056 问题，需单独清理后再纳入（技术债）。
      # 同样未纳入：openspec/changes/** 的历史变更文档（既存 MD009 / MD024 / MD058 问题）。
      # 新增文档请自行确保通过；清理完成后可把范围扩到这两个目录。
      - name: Run markdownlint
        run: |
          npx markdownlint-cli "docs/*.md" \
            "wasm-modules/README.md" \
            "openspec/project.md" \
            "openspec/AGENTS.md" \
            "AGENTS.md" \
            "speckit/AGENTS.md" \
            "backend/AGENTS.md"
